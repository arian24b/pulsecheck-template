name: monitor
on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub may delay scheduled runs by a few minutes
  workflow_dispatch:
  repository_dispatch:   # external cron fallback: POST /repos/OWNER/REPO/dispatches {"event_type":"pulsecheck"}
    types: [pulsecheck]
concurrency: monitor

jobs:
  check:
    # the template repository itself only runs when started by hand
    if: github.repository != 'arian24b/pulsecheck-template' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # add every secret that pulsecheck.yml uses as ${NAME}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT: ${{ secrets.TG_CHAT }}
      PULSECHECK: pulsecheckcli>=0.1,<1
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Restore state
        uses: actions/cache/restore@v6
        with:
          path: pulsecheck.db
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: Check the sites
        run: uvx --from "$PULSECHECK" pulsecheck -c pulsecheck.yml run
      - name: Status summary
        if: always()
        run: uvx --from "$PULSECHECK" pulsecheck -c pulsecheck.yml status --md >> "$GITHUB_STEP_SUMMARY"
      - name: Save state
        if: always()
        uses: actions/cache/save@v6
        with:
          path: pulsecheck.db
          key: state-${{ github.run_id }}
